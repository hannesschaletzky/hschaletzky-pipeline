name: Dependabot auto-merge

# Minor and patch updates from Dependabot merge themselves once the required CI checks pass
# (GitHub auto-merge waits for them). Major updates stay open for a manual review.
#
# The merge runs with a fine-grained token of the owner (Dependabot secret
# DEPENDABOT_AUTOMERGE_TOKEN: contents, pull requests and workflows on this repo only, expires
# yearly). With the built-in GITHUB_TOKEN the merge would not trigger CI and deploy on main.
on: pull_request

permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
